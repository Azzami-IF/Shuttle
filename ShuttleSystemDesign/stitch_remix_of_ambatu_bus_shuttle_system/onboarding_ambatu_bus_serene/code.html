<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Ambatu Bus - Welcome</title>
<!-- Google Fonts: Hanken Grotesk -->
<link href="https://fonts.googleapis.com" rel="preconnect">

<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#2d3e33', // Forest Green from Design System
              surface: '#f8faf5',
              container: '#f2f4f0',
            }
          },
          fontFamily: {
            sans: ['Hanken Grotesk', 'sans-serif'],
          },
          borderRadius: {
            'custom': '8px', // ROUND_EIGHT from Design System
          }
        }
      }
    }
  </script>
<style data-purpose="custom-layout">
    body {
      background-color: #f8faf5;
      font-family: 'Hanken Grotesk', sans-serif;
    }
    .gradient-overlay {
      background: linear-gradient(180deg, rgba(248, 250, 245, 0) 0%, rgba(45, 62, 51, 0.1) 100%);
    }
    .bottom-sheet {
      background: linear-gradient(180deg, #3d5445 0%, #2d3e33 100%);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
    }
  </style>
</head>

<h1 class="text-2xl font-bold text-brand-primary leading-tight">
        Explore Perjalanan Ke Tempat Baru Bersama Ambatu Bus!
      </h1>
<p class="text-gray-600 text-base leading-relaxed">
        Layanan bus shuttle antar kota yang nyaman, aman, dan terpercaya untuk setiap perjalanan Anda.
      </p>
</div>
<!-- Pagination Indicators -->
<div class="flex space-x-2 mb-8" data-purpose="pagination">

<div class="w-6 h-2 rounded-full bg-brand-primary"></div>
<div class="w-2 h-2 rounded-full bg-brand-primary/20"></div>

<footer class="bottom-sheet p-8 space-y-4 shadow-2xl" data-purpose="interaction-footer">

<button class="w-full bg-white text-brand-primary font-bold py-4 rounded-custom transition-transform active:scale-[0.98]" onclick="window.location.href='{{DATA:SCREEN:SCREEN_32}}'">
