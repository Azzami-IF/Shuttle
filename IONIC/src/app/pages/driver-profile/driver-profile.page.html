<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/driver-dashboard" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Profil Saya</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="driver-profile-page">
  <main class="p-4" *ngIf="user$ | async as user">
    <div class="profile-card glass-panel">
      <div class="avatar">
        <span class="material-symbols-outlined text-[48px]">person</span>
      </div>
      <div class="info">
        <h2>{{ user.name }}</h2>
        <p>Driver ID: DRV-MOBILE-90210</p>
      </div>
    </div>

    <div class="menu-list mt-8">
      <button class="menu-item" (click)="showPending()">
        <span class="material-symbols-outlined">badge</span>
        <span>Informasi Akun</span>
        <span class="material-symbols-outlined ml-auto">chevron_right</span>
      </button>
      <button class="menu-item" (click)="showPending()">
        <span class="material-symbols-outlined">settings</span>
        <span>Pengaturan Aplikasi</span>
        <span class="material-symbols-outlined ml-auto">chevron_right</span>
      </button>
      <button class="menu-item" (click)="showPending()">
        <span class="material-symbols-outlined">help</span>
        <span>Pusat Bantuan</span>
        <span class="material-symbols-outlined ml-auto">chevron_right</span>
      </button>

      <button class="menu-item logout-btn mt-8" type="button" (click)="confirmLogout()">
        <span class="material-symbols-outlined">logout</span>
        <span>Logout</span>
      </button>
    </div>
  </main>
</ion-content>

<nav class="bottom-nav">
  <button class="nav-item" routerLink="/driver-dashboard">
    <span class="material-symbols-outlined">home</span>
    <span>Home</span>
  </button>
  <button class="nav-item" routerLink="/driver-trips">
    <span class="material-symbols-outlined">analytics</span>
    <span>Monitoring</span>
  </button>
  <button class="nav-item" routerLink="/driver-status">
    <span class="material-symbols-outlined">route</span>
    <span>Status</span>
  </button>
  <button class="nav-item active">
    <span class="material-symbols-outlined">person</span>
    <span>Profile</span>
  </button>
</nav>
