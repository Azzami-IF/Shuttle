<ion-content class="onboarding-page" [fullscreen]="true">
  <div class="main-content">
    <div class="utility-bar">
      <div class="lang-selector">
        <span class="flag"></span>
        <span class="label">ID</span>
        <span class="material-symbols-outlined text-[16px]">expand_more</span>
      </div>
    </div>

    <div class="illustration-container">
      <img src="https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&q=80&w=1000" alt="Traveling with Ambatu Bus">
    </div>

    <div class="text-content">
      <h1>Explore Perjalanan Ke Tempat Baru Bersama Ambatu Bus!</h1>
      <p>Layanan bus shuttle antar kota yang nyaman, aman, dan terpercaya untuk setiap perjalanan Anda.</p>
    </div>

    <div class="pagination">
      <div class="dot"></div>
      <div class="dot active"></div>
      <div class="dot"></div>
    </div>
  </div>

  <footer class="bottom-sheet">
    <div class="handle"></div>
    <button class="primary-btn" (click)="goToLogin()">Masuk</button>
    <button class="secondary-btn" (click)="continueAsGuest()">Masuk Tanpa Daftar</button>
    <div class="home-indicator"></div>
  </footer>
</ion-content>
