<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="homeRoute" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Profil Saya</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="profile-page">
  <main class="p-4" *ngIf="user$ | async as user">
    <!-- Profile Header Card -->
    <div class="profile-hero-card glass-panel">
      <div class="avatar-container">
        <div class="avatar">
          <span class="material-symbols-outlined text-[48px]">person</span>
        </div>
        <div class="role-badge" [class]="user.role">
          {{ user.role | uppercase }}
        </div>
      </div>
      <div class="user-info">
        <h2>{{ user.name }}</h2>
        <p>{{ user.email }}</p>
        <p class="phone" *ngIf="user.phone">{{ user.phone }}</p>
      </div>
    </div>

    <!-- Account Sections -->
    <div class="menu-container mt-8">
      <h3 class="section-title">Informasi Akun</h3>
      <div class="menu-list">
        <button class="menu-item" (click)="openEditProfile(user)">
          <span class="material-symbols-outlined icon">badge</span>
          <div class="label-box">
            <span class="title">Data Pribadi</span>
            <span class="sub">Kelola nama dan info kontak</span>
          </div>
          <span class="material-symbols-outlined arrow">chevron_right</span>
        </button>

        <button class="menu-item" (click)="openChangePassword()">
          <span class="material-symbols-outlined icon">security</span>
          <div class="label-box">
            <span class="title">Keamanan</span>
            <span class="sub">Ganti kata sandi & verifikasi</span>
          </div>
          <span class="material-symbols-outlined arrow">chevron_right</span>
        </button>
      </div>
    </div>

    <!-- Logout Action -->
    <div class="mt-10 mb-12">
      <button class="logout-btn" type="button" (click)="confirmLogout()">
        <span class="material-symbols-outlined">logout</span>
        Logout
      </button>
      <p class="version-text text-center mt-4">Versi 1.0.4-serene</p>
    </div>
    <!-- Edit Profile Modal Overlay -->
    <div class="custom-modal-overlay" *ngIf="isEditingProfile">
      <div class="custom-modal-content glass-panel">
        <h3 class="modal-title">Ubah Data Pribadi</h3>
        <form (submit)="saveProfile()">
          <div class="input-group">
            <label>Nama Lengkap</label>
            <input type="text" [(ngModel)]="profileData.name" name="name" required class="custom-input" />
          </div>
          <div class="input-group">
            <label>Nomor Telepon</label>
            <input type="tel" [(ngModel)]="profileData.phone" name="phone" class="custom-input" />
          </div>
          <div class="modal-actions">
            <button type="button" class="btn-cancel" (click)="isEditingProfile = false">Batal</button>
            <button type="submit" class="btn-submit" [disabled]="isLoading">Simpan</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Change Password Modal Overlay -->
    <div class="custom-modal-overlay" *ngIf="isChangingPassword">
      <div class="custom-modal-content glass-panel">
        <h3 class="modal-title">Ganti Kata Sandi</h3>
        <form (submit)="savePassword()">
          <div class="input-group">
            <label>Kata Sandi Lama</label>
            <input type="password" [(ngModel)]="passwordData.old_password" name="old_password" required class="custom-input" />
          </div>
          <div class="input-group">
            <label>Kata Sandi Baru</label>
            <input type="password" [(ngModel)]="passwordData.new_password" name="new_password" required class="custom-input" />
          </div>
          <div class="modal-actions">
            <button type="button" class="btn-cancel" (click)="isChangingPassword = false">Batal</button>
            <button type="submit" class="btn-submit" [disabled]="isLoading">Simpan</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</ion-content>

<!-- Dynamic Footer Based on Role -->
<ng-container *ngIf="user$ | async as user">
  <!-- Passenger Footer -->
  <nav class="bottom-nav" *ngIf="user.role === 'customer'">
    <button class="nav-item" routerLink="/dashboard">
      <span class="material-symbols-outlined">home</span>
      <span>Home</span>
    </button>
    <button class="nav-item" routerLink="/schedule-list">
      <span class="material-symbols-outlined">directions_bus</span>
      <span>Schedule</span>
    </button>
    <button class="nav-item" routerLink="/booking-detail">
      <span class="material-symbols-outlined">confirmation_number</span>
      <span>Bookings</span>
    </button>
    <button class="nav-item active">
      <span class="material-symbols-outlined">person</span>
      <span>Profile</span>
    </button>
  </nav>

  <!-- Driver Footer -->
  <nav class="bottom-nav" *ngIf="user.role === 'driver'">
    <button class="nav-item" routerLink="/driver-dashboard">
      <span class="material-symbols-outlined">home</span>
      <span>Home</span>
    </button>
    <button class="nav-item" routerLink="/driver-trips">
      <span class="material-symbols-outlined">analytics</span>
      <span>Monitoring</span>
    </button>
    <button class="nav-item" routerLink="/driver-status">
      <span class="material-symbols-outlined">route</span>
      <span>Status</span>
    </button>
    <button class="nav-item active">
      <span class="material-symbols-outlined">person</span>
      <span>Profile</span>
    </button>
  </nav>
</ng-container>
