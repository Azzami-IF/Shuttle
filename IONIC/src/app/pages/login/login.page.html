<ion-content class="login-page">
  <div class="relative w-full max-w-[480px] min-h-screen md:min-h-[844px] mx-auto md:my-8 bg-surface-container-lowest md:rounded-[40px] md:shadow-2xl overflow-hidden flex flex-col">
    <!-- Hero Illustration Section -->
    <div class="hero-section">
      <div class="hero-img-container">
        <img class="hero-img" src="https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&q=80&w=1000" alt="Modern bus illustration">
        <div class="hero-overlay"></div>
      </div>

      <!-- Header UI -->
      <div class="header-ui">
        <button class="back-btn" (click)="goBack()">
          <span class="material-symbols-outlined">arrow_back</span>
        </button>
      </div>

      <!-- Logo -->
      <div class="logo-container">
        <img alt="Ambatu Bus Logo" class="logo-img animate-float" src="assets/icon/favicon.png">
      </div>

      <!-- Driver Login Link (Added as per requirement to switch) -->
      <div class="driver-switch-container">
        <a (click)="goToDriverLogin()" class="driver-link">Masuk sebagai Driver</a>
      </div>
    </div>

    <!-- Login Form Content -->
    <div class="login-form-content glass-panel">
      <div class="text-center">
        <h1>Selamat Datang!</h1>
        <p>Masuk untuk memesan tiket bus favoritmu dengan lebih cepat.</p>
      </div>

      <form (submit)="onLogin($event)">
        <!-- Input Group: Email/Phone -->
        <div class="input-group">
          <label>Email / No. Telp</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined icon">person</span>
            <input class="custom-input" placeholder="Masukkan Email atau No. Telp" type="text" [(ngModel)]="loginData.email" name="email" required autocomplete="off">
          </div>
        </div>

        <!-- Input Group: Password -->
        <div class="input-group">
          <label>Kata Sandi</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined icon">lock</span>
            <input class="custom-input" placeholder="Masukkan Kata Sandi" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="loginData.password" name="password" required autocomplete="off">
            <button class="toggle-password" type="button" (click)="showPassword = !showPassword">
              <span class="material-symbols-outlined">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
            </button>
          </div>
          <div class="forgot-password">
            <a href="javascript:void(0)">Lupa Sandi?</a>
          </div>
        </div>

        <!-- Primary CTA -->
        <button class="submit-btn" type="submit" [disabled]="isLoading">
          <span *ngIf="!isLoading">Masuk</span>
          <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
        </button>
      </form>

      <!-- Registration Prompt -->
      <div class="register-prompt">
        <p>Belum punya akun? <a [routerLink]="['/register']">Daftar Sekarang</a></p>
      </div>
    </div>
  </div>
</ion-content>
