<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Login - Ambatu Bus</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="login-container">
    <div class="logo-section ion-text-center">
      <img src="assets/icon/favicon.png" alt="Logo" style="width: 80px;">
      <h1>Welcome Back</h1>
    </div>

    <form (ngSubmit)="onLogin()">
      <ion-item lines="full">
        <ion-label position="floating">Email</ion-label>
        <ion-input type="email" [(ngModel)]="credentials.email" name="email" required></ion-input>
      </ion-item>

      <ion-item lines="full">
        <ion-label position="floating">Password</ion-label>
        <ion-input type="password" [(ngModel)]="credentials.password" name="password" required></ion-input>
      </ion-item>

      <ion-button expand="block" type="submit" class="ion-margin-top">
        Login
      </ion-button>
    </form>

    <div class="ion-text-center ion-margin-top">
      <p>Don't have an account? <a routerLink="/register">Register here</a></p>
    </div>
  </div>
</ion-content>
