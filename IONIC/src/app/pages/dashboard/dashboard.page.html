<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Dashboard</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">
        <ion-icon name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="user$ | async as user">
    <h2>Hello, {{ user.name }}!</h2>
    <p>You are logged in as <strong>{{ user.role }}</strong></p>

    <ion-grid>
      <ion-row>
        <!-- Customer Actions -->
        <ion-col size="12" *ngIf="user.role === 'customer'">
          <ion-card routerLink="/schedule-list">
            <ion-card-header>
              <ion-card-title>Book Shuttle</ion-card-title>
            </ion-card-header>
            <ion-card-content>
              Find available schedules and book your seat.
            </ion-card-content>
          </ion-card>
        </ion-col>

        <!-- Driver Actions -->
        <ion-col size="12" *ngIf="user.role === 'driver'">
          <ion-card routerLink="/driver-trips">
            <ion-card-header>
              <ion-card-title>My Trips</ion-card-title>
            </ion-card-header>
            <ion-card-content>
              Manage your assigned trips and update location.
            </ion-card-content>
          </ion-card>
        </ion-col>

        <!-- Common Actions -->
        <ion-col size="12">
          <ion-card routerLink="/booking-detail">
            <ion-card-header>
              <ion-card-title>Booking History</ion-card-title>
            </ion-card-header>
            <ion-card-content>
              View your past and upcoming bookings.
            </ion-card-content>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
