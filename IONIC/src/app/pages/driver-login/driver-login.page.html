<ion-content class="driver-login-page">
  <header class="top-bar">
    <div class="brand">
      <span class="material-symbols-outlined text-3xl">directions_bus</span>
      <span class="title">Ambatu Bus</span>
    </div>
    <div class="version">Fleet Operations v1.0.4</div>
  </header>

  <main class="main-container">

    <!-- Right Side: Login Form -->
    <div class="form-side">
      <div class="glass-card">
        <div class="form-header">
          <h1>Driver Login</h1>
          <p>Enter your credentials to access the operational dashboard and routes.</p>
        </div>

        <form (submit)="onLogin($event)">
          <div class="input-group">
            <label for="driver_id">Driver ID or Email</label>
            <div class="input-wrapper">
              <span class="material-symbols-outlined icon">badge</span>
              <input type="text" id="driver_id" name="email" [(ngModel)]="loginData.email" placeholder="e.g. DRV-8829 or email@ambatu.com" autocomplete="off" required>
            </div>
          </div>

          <div class="input-group">
            <div class="label-row">
              <label for="password">Password</label>
              <a href="javascript:void(0)" class="forgot">Forgot?</a>
            </div>
            <div class="input-wrapper">
              <span class="material-symbols-outlined icon">lock</span>
              <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" [(ngModel)]="loginData.password" placeholder="••••••••" autocomplete="off" required>
              <button type="button" class="toggle-password" (click)="showPassword = !showPassword">
                <span class="material-symbols-outlined">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
              </button>
            </div>
          </div>

          <div class="remember-me">
            <input type="checkbox" id="remember">
            <label for="remember">Keep me logged in on this device</label>
          </div>

          <button type="submit" class="primary-btn" [disabled]="isLoading">
            <span *ngIf="!isLoading">Login as Driver</span>
            <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
            <span class="material-symbols-outlined" *ngIf="!isLoading">arrow_forward</span>
          </button>
        </form>

        <div class="back-link">
          <a (click)="goToPassengerLogin()">
            <span class="material-symbols-outlined">arrow_back</span>
            Back to Passenger Login
          </a>
        </div>
      </div>
    </div>
  </main>

  <div class="bg-decorative-1"></div>
  <div class="bg-decorative-2"></div>
</ion-content>
