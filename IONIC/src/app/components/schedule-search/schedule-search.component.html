<div class="schedule-search-container">
  <!-- Main Search Bar -->
  <div class="search-bar p-4 bg-gradient-to-r from-emerald-600 to-emerald-700 text-white">
    <ion-searchbar 
      [(ngModel)]="searchTerm" 
      (ionInput)="onSearchInput(searchTerm)"
      placeholder="Cari jadwal, rute, atau unit"
      showCancelButton="focus"
      cancelButtonText="Batal"
      class="searchbar-white">
    </ion-searchbar>
  </div>

  <!-- Quick Filters -->
  <div class="quick-filters p-3 bg-white/50 backdrop-blur-sm border-b border-emerald-100">
    <div class="text-sm font-semibold text-gray-700 mb-2">Filter Cepat</div>
    
    <!-- Time Periods -->
    <div class="filter-group mb-3">
      <div class="text-xs text-gray-600 mb-1">Waktu Keberangkatan</div>
      <div class="filter-buttons">
        <button 
          *ngFor="let period of categories?.timePeriods"
          class="filter-btn"
          [class.active]="isQuickFilterSelected('time', period.value)"
          (click)="applyQuickFilter('time', period.value)">
          {{ period.label }}
        </button>
      </div>
    </div>

    <!-- Price Ranges -->
    <div class="filter-group mb-3">
      <div class="text-xs text-gray-600 mb-1">Rentang Harga</div>
      <div class="filter-buttons">
        <button 
          *ngFor="let price of categories?.priceRanges"
          class="filter-btn"
          [class.active]="isQuickFilterSelected('price', price.value)"
          (click)="applyQuickFilter('price', price.value)">
          {{ price.label }}
        </button>
      </div>
    </div>

    <!-- Vehicle Types -->
    <div class="filter-group">
      <div class="text-xs text-gray-600 mb-1">Jenis Kendaraan</div>
      <div class="filter-buttons">
        <button 
          *ngFor="let vehicle of categories?.vehicleTypes"
          class="filter-btn"
          [class.active]="isQuickFilterSelected('vehicle', vehicle.value)"
          (click)="applyQuickFilter('vehicle', vehicle.value)">
          {{ vehicle.label }}
        </button>
      </div>
    </div>
  </div>

  <!-- Advanced Filters Toggle -->
  <div class="advanced-toggle p-3 border-b border-gray-200">
    <button 
      class="w-full flex items-center justify-between text-gray-700 hover:text-emerald-600 transition"
      (click)="toggleAdvancedFilters()">
      <span class="text-sm font-semibold">
        Filter Lanjut
        <ion-badge *ngIf="getActiveFilterCount() > 0" color="danger">
          {{ getActiveFilterCount() }}
        </ion-badge>
      </span>
      <span class="material-symbols-outlined transition" [class.rotate-180]="showAdvancedToggle">
        expand_more
      </span>
    </button>
  </div>

  <!-- Advanced Filters Section -->
  <div class="advanced-filters" *ngIf="showAdvancedToggle" [@slideDown]>
    <div class="p-4 bg-gray-50 border-b border-gray-200">
      <div class="space-y-4">
        <!-- Origin & Destination -->
        <div class="form-group">
          <label class="text-xs font-semibold text-gray-700">Asal & Tujuan</label>
          <div class="flex gap-2 items-center">
            <div class="flex-1 relative">
              <input 
                [(ngModel)]="origin"
                (input)="onOriginInput($any($event).target.value)"
                placeholder="Dari mana?"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-emerald-500">
              <div class="absolute top-full left-0 right-0 bg-white border border-gray-300 rounded-lg mt-1 shadow-lg z-10" 
                   *ngIf="originSuggestions.length > 0">
                <div *ngFor="let s of originSuggestions" 
                     class="px-3 py-2 hover:bg-emerald-50 cursor-pointer text-sm"
                     (click)="selectOrigin(s)">
                  {{ s }}
                </div>
              </div>
            </div>
            <span class="material-symbols-outlined text-gray-400">arrow_forward</span>
            <div class="flex-1 relative">
              <input 
                [(ngModel)]="destination"
                (input)="onDestinationInput($any($event).target.value)"
                placeholder="Kemana?"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-emerald-500">
              <div class="absolute top-full left-0 right-0 bg-white border border-gray-300 rounded-lg mt-1 shadow-lg z-10"
                   *ngIf="destinationSuggestions.length > 0">
                <div *ngFor="let s of destinationSuggestions"
                     class="px-3 py-2 hover:bg-emerald-50 cursor-pointer text-sm"
                     (click)="selectDestination(s)">
                  {{ s }}
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Date -->
        <div class="form-group">
          <label class="text-xs font-semibold text-gray-700">Tanggal Keberangkatan</label>
          <input 
            type="date"
            [(ngModel)]="date"
            (change)="applyFilters()"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-emerald-500">
        </div>

        <!-- Time Range -->
        <div class="form-group">
          <label class="text-xs font-semibold text-gray-700">Rentang Waktu</label>
          <div class="flex gap-2">
            <input 
              type="time"
              [(ngModel)]="timeFrom"
              (change)="applyFilters()"
              placeholder="Dari jam"
              class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-emerald-500">
            <input 
              type="time"
              [(ngModel)]="timeTo"
              (change)="applyFilters()"
              placeholder="Sampai jam"
              class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <!-- Price Range -->
        <div class="form-group">
          <label class="text-xs font-semibold text-gray-700">Rentang Harga (Rp)</label>
          <div class="flex gap-2">
            <input 
              type="number"
              [(ngModel)]="priceMin"
              (change)="applyFilters()"
              placeholder="Min"
              class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-emerald-500">
            <input 
              type="number"
              [(ngModel)]="priceMax"
              (change)="applyFilters()"
              placeholder="Max"
              class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <!-- Available Seats -->
        <div class="form-group">
          <label class="text-xs font-semibold text-gray-700">Minimum Kursi Tersedia</label>
          <input 
            type="number"
            [(ngModel)]="availableSeatsMin"
            (change)="applyFilters()"
            min="1"
            placeholder="Jumlah kursi"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-emerald-500">
        </div>

        <!-- Available Only Checkbox -->
        <div class="form-group flex items-center gap-2">
          <input 
            type="checkbox"
            [(ngModel)]="availableOnly"
            (change)="applyFilters()"
            id="available-only"
            class="w-4 h-4">
          <label for="available-only" class="text-sm text-gray-700 cursor-pointer">
            Hanya tampilkan jadwal dengan kursi tersedia
          </label>
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-2 pt-2">
          <button 
            (click)="performSearch()"
            class="flex-1 px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-semibold hover:bg-emerald-700 transition">
            Cari Jadwal
          </button>
          <button 
            (click)="resetFilters()"
            class="flex-1 px-4 py-2 border border-gray-300 text-gray-700 rounded-lg text-sm font-semibold hover:bg-gray-100 transition">
            Reset
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
