<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Login - Ambatu Bus</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Hanken Grotesk', 'sans-serif'],
          },
          colors: {
            'transit-primary': '#2d3e33', // Serene Transit Dark Green
            'transit-surface': '#f8faf5',
            'transit-surface-dim': '#d9dbd6',
            'transit-container': '#f2f4f0',
            'transit-accent': '#7c9082', // Muted sage/green accent
          },
          borderRadius: {
            'transit': '8px', // ROUND_EIGHT from design system
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#f2f4f0] font-sans antialiased text-gray-900">
<main class="max-w-md mx-auto bg-transit-surface min-h-screen relative overflow-x-hidden shadow-2xl">
<!-- BEGIN: HeroSection -->
<header class="relative h-[380px] w-full overflow-hidden" data-purpose="hero-background">
<!-- The background image provided in the snapshot -->
<img alt="Ambatu Bus Terminal" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/ADBb0uhODsB8rn1I-661PlJIDwtL2rcZYh_XrY4HntLFqH7yeGqcmN5PeviCDpcLzqNeNHgftjbeUmCnF4FxzDENzWnGZJVBxzNuA0S4GsZcb6OB-gwfBBuWJu-zuUuU0-IG3_FUZp61QPlDWBx5AVCYSfDjUXBlKRaeT1bVeZ2NpDK6o8dDaORd2krAFlXwKPhglm1_dKISTyUBEfiDO0W0r6xAL7A5RC4MUzUS73CSfULnd6gUoTyBa5z1EbIA">
<!-- Overlay to blend with green theme -->
<div class="absolute inset-0 bg-transit-primary/20 mix-blend-multiply"></div>
<!-- Overlay for Status Bar / Top Controls -->
<div class="absolute top-0 left-0 w-full p-4 flex justify-between items-start">
<!-- Back Button -->
<button class="p-2 text-white drop-shadow-md" data-purpose="back-navigation">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<!-- Language Selector -->
<div class="bg-white/90 backdrop-blur-sm rounded-full px-3 py-1 flex items-center gap-2 shadow-sm border border-white/20" data-purpose="language-picker">
<img alt="ID Flag" class="w-5 h-3.5 object-cover rounded-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAU0nfwu1hHtG2o93wIiPSR9clUH1W4GjZ81yPY0o0COsu7RR4tPOQviCl1hmXWpI74UfVHIi3rRR-vWmCylWC3_DtXwoEv4kZEACIVl79-88BskztMe56-SAv3uQ_xOoOeeggS2jNdRxV42FXGgrH1j12_TT7Un3PITKhqrH73np-NrApreL9RBizHInpTuqA3F5JTcX1-S5W_ivs5gpl_PJeyeWedeCrnus3myA3bnR64rBP9htSCrl4V5hRDnRINpABkOHgNYIP9">
<span class="text-sm font-semibold text-transit-primary">ID</span>
<svg class="h-4 w-4 text-transit-primary" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" fill-rule="evenodd"></path>
</svg>
</div>
</div>
</header>
<!-- END: HeroSection -->
<!-- BEGIN: LoginCard -->
<section class="relative -mt-16 bg-transit-surface rounded-t-[40px] px-8 pt-10 pb-12 shadow-[0_-8px_30px_rgba(0,0,0,0.08)] min-h-[600px]" data-purpose="login-form-container">
<!-- Welcome Heading -->
<div class="mb-8">
<h1 class="text-2xl font-bold text-transit-primary mb-2">Selamat Datang Di Ambatu Bus!</h1>
<p class="text-transit-accent leading-relaxed">Login atau Register sekarang untuk menikmati semua fitur yang tersedia di Ambatu Bus.</p>
</div>
<!-- Login Form -->
<form class="space-y-6" data-purpose="auth-form">
<div class="space-y-2">
<label class="block text-sm font-medium text-transit-primary/80 ml-1" for="email_phone">Email / No. Telp</label>
<input class="w-full px-5 py-4 border border-transit-surface-dim bg-transit-container rounded-transit focus:ring-2 focus:ring-transit-accent focus:border-transparent outline-none transition-all placeholder:text-gray-400 text-transit-primary" id="email_phone" name="email_phone" placeholder="Masukkan Email atau No. Telp anda" type="text">
</div>
<button class="w-full bg-transit-primary hover:bg-[#1e2a22] text-white font-bold py-4 rounded-transit shadow-md transition-all active:scale-[0.99]" type="submit">
          MASUK
        </button>
</form>
<!-- Registration Prompt -->
<div class="mt-6 text-center">
<p class="text-sm text-transit-accent">
          Belum punya akun? <a class="text-transit-primary font-bold decoration-transit-accent/30 underline-offset-4 hover:underline" href="#">Daftar Sekarang</a>
</p>
</div>
<!-- Separator -->
<div class="relative my-10">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-transit-surface-dim"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-4 bg-transit-surface text-transit-accent font-medium uppercase tracking-wider text-[10px]">Atau gunakan akun</span>
</div>
</div>
<!-- Social and Guest Login Options -->
<div class="space-y-4">
<!-- Apple Login Button -->
<button class="w-full flex items-center justify-center gap-3 border border-transit-surface-dim py-4 rounded-transit hover:bg-transit-container transition-colors bg-white shadow-sm" data-purpose="apple-login">
<svg class="w-5 h-5 text-transit-primary" fill="currentColor" viewBox="0 0 384 512">
<path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 21.8-88.5 21.8-11.4 0-51.1-22.2-81.9-23-41.9-.3-80.4 23.9-101.7 60.6-42.3 73.1-10.7 181.1 29.8 243.5 21.2 31.1 43.2 62.7 75.3 61.6 30.2-1.1 44.4-18.1 82.1-18.1 37.8 0 51.4 18.1 82.7 17.5 32.1-.6 51.7-28.5 71.3-57.1 22.6-33 31.7-65 32.1-66.8-.7-.3-62.7-24.1-62.9-94.5zm-44-177.6c16.3-19.7 26.9-46.6 23.9-74.1-23.3 1-51.4 15.5-68.1 35.1-14.9 17.5-28.1 45.3-24.6 71.8 26.1 2 52.5-13.1 68.8-32.8z"></path>
</svg>
<span class="font-bold text-transit-primary">Sign in with Apple</span>
</button>
<!-- Guest Login Button -->
<button class="w-full flex items-center justify-center gap-3 border border-transit-surface-dim py-4 rounded-transit hover:bg-transit-container transition-colors bg-white shadow-sm" data-purpose="google-login"><svg class="w-5 h-5" viewBox="0 0 48 48"><path d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z" fill="#4285F4"></path><path d="M6.3 14.7l6.6 4.8C14.6 15.5 18.9 13 24 13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 6.1 29.6 4 24 4 16.3 4 9.6 8.3 6.3 14.7z" fill="#EA4335"></path><path d="M24 44c5.1 0 9.7-1.8 13.3-4.8l-6.5-5.3c-1.9 1.4-4.3 2.1-6.8 2.1-5.1 0-9.4-3.4-10.9-8.1l-6.7 5.2C9.8 39.5 16.4 44 24 44z" fill="#34A853"></path><path d="M43.6 19.5c.3 1.5.4 3 .4 4.5 0 7.7-2.7 14.2-7.4 18.5l-6.5-5.3c2.4-1.6 4.3-4.1 5.1-7.1h-11.2V20h19.6z" fill="#FBBC05"></path></svg><span class="font-bold text-transit-primary">Sign in with Google</span></button>
</div>
</section>
<!-- END: LoginCard -->
<!-- BEGIN: AppFooter -->
<footer class="pb-8 pt-4 px-8 bg-transit-surface text-center">
<p class="text-[10px] text-transit-accent/60 uppercase tracking-widest font-semibold">© 2023 AMBATU BUS • VERSI 4.2.1</p>
</footer>
<!-- END: AppFooter -->
</main>
<!-- Custom Styles for UI Enhancements -->
<style data-purpose="layout-styling">
    /* Custom shadow and radius adjustments if needed */
    .shadow-inner-soft {
      box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.05);
    }
    input::placeholder {
      color: #94a3b8;
    }
  </style>




</body></html>
