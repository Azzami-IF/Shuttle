<!DOCTYPE html>

<html lang="id" style=""><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ambatu Bus - Onboarding</title>
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            serene: {
              surface: '#f8faf5',
              'surface-dim': '#d9dbd6',
              primary: '#2d3e33',    // Dark Forest Green
              secondary: '#4a6354',  // Sage Green
              light: '#f1f5f2',      // Very Light Sage
              accent: '#8ba895'      // Muted Sage
            }
          },
          fontFamily: {
            sans: ['Hanken Grotesk', 'sans-serif'],
          },
          borderRadius: {
            'serene': '8px',
          }
        }
      }
    }
  </script>
<style data-purpose="layout-adjustments">
    body {
      background-color: #f8faf5; /* serene.surface */
      font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }
    /* Simulate mobile screen height for the persistent bottom sheet */
    .onboarding-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* Rounded top corners for the bottom sheet */
    .bottom-sheet {
      border-top-left-radius: 40px;
      border-top-right-radius: 40px;
    }
  </style>
</head>
<body class="bg-serene-surface">
<!-- BEGIN: OnboardingContainer -->
<main class="onboarding-wrapper relative flex flex-col min-h-screen">
<!-- BEGIN: HeaderSection -->
<header class="flex justify-end items-center p-6" data-purpose="top-navigation">
<!-- Language Selector -->
<div class="flex items-center space-x-2 border border-serene-accent/30 rounded-full px-3 py-1 shadow-sm bg-white" data-purpose="language-selector">
<img alt="Indonesian Flag" class="w-5 h-4 object-cover rounded-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAFXESMCqeD6EHUe4lshwfdDbPfe-Jj-8jsJA-LNN3q0uBcGYl2uo3lNdedwyjk9LwApHGmOy9CHi2r-7YXPEaUG4WEo9HsziERimHKB0iiagCYqAdGgAgPJFg3-7C9REZAaK15nCRJJ7Gypi7_O4r2eL8qX-QEJgYb0l8EZCAvIkuCJEi1Hys5KbcIifZbs-jbgg09f5oxt2bth9C04gEaNjiEFumcIwV3g19Ok8jxyGzwbx6hvGnQrIZLty5w7SdTxweIp6MftQ2G"/>
<span class="text-sm font-semibold text-serene-primary">ID</span>
<svg class="h-4 w-4 text-serene-secondary" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</header>
<!-- END: HeaderSection -->
<!-- BEGIN: HeroIllustration -->
<section class="flex-grow flex flex-col items-center justify-center px-8" data-purpose="hero-content">
<!-- Main Illustration Placeholder -->
<div class="w-full max-w-sm mb-8" data-purpose="illustration-container">
<img alt="Ambatu Bus Travel Illustration" class="w-full h-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAtDviPomwRIz2idPKgkWFPZIEJkW764W75Umj-Fq7tae8YTJ6Rh2a32yUv8CrFzCeORhJFXfpa_rJt0YudNo5m2or06dl-85bQCpY2SSSFzwYqYGrsD2_8krtgqD2B9xej6FcbakhpyYw0Oc2VY1xQDRsKbPEEPd-iW_oWapl2Dr6R_8jXnEtPAXhj_keWMaU_M3d3R9lf_SrLTcii38Ri-OelhAVZPY8Lov5gKs8hoS-2lGJ-qIvX801tekfwXVNwd3PAEnWEO-xH"/>
</div>
<!-- Textual Content -->
<div class="text-left w-full space-y-4" data-purpose="copy-text">
<h1 class="text-2xl md:text-3xl font-extrabold text-serene-primary leading-tight">
          Explore Perjalanan Ke Tempat Baru Bersama Ambatu Bus!
        </h1>
<p class="text-serene-secondary text-base font-medium leading-relaxed">
          Layanan bus shuttle antar kota yang nyaman, aman, dan terpercaya.
        </p>
</div>
</section>
<!-- END: HeroIllustration -->
<!-- BEGIN: PaginationIndicators -->
<div class="flex justify-center items-center space-x-2 mb-10" data-purpose="carousel-dots">
<div class="h-1.5 w-1.5 rounded-full bg-serene-accent/40"></div>
<div class="h-1.5 w-1.5 rounded-full bg-serene-accent/40"></div>
<div class="h-1.5 w-6 rounded-full bg-serene-primary"></div>
</div>
<!-- END: PaginationIndicators -->
<!-- BEGIN: BottomSheetActions -->
<footer class="bottom-sheet bg-serene-primary p-8 pb-12 shadow-2xl mt-auto" data-purpose="action-sheet">
<!-- Handle line for visual sheet affordance -->
<div class="w-16 h-1.5 bg-white/20 rounded-full mx-auto mb-8"></div>
<div class="flex flex-col space-y-4">
<!-- Main Login Button -->
<button class="w-full py-4 bg-white text-serene-primary font-bold rounded-2xl shadow-lg active:scale-[0.98] transition-all" data-purpose="login-button" style="opacity: 1;">Masuk</button>
<!-- Guest Access Button -->
<button class="w-full py-4 bg-transparent border-2 border-white/30 text-white font-bold rounded-2xl active:bg-white/10 transition-all" data-purpose="guest-button">
          Masuk Tanpa Daftar
        </button>
</div>
<!-- iOS Home Indicator Spacing -->
<div class="h-4"></div>
</footer>
<!-- END: BottomSheetActions -->
</main>
<!-- END: OnboardingContainer -->
</body></html>
