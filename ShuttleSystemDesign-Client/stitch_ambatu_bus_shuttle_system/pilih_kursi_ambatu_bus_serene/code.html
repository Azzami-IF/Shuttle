</button>

<script>
        const leftGrid = document.getElementById('seats-left');
        const rightGrid = document.getElementById('seats-right');
        const seatLabel = document.getElementById('selected-seat-label');
        const confirmBtn = document.getElementById('confirm-btn');
        let currentSelected = null;

        const occupiedSeats = ['A2', 'B4', 'C1', 'C5', 'D3', 'D8', 'A9'];

        function createSeat(row, col) {
            const seatId = `${col}${row}`;
            const isOccupied = occupiedSeats.includes(seatId);
            
            const btn = document.createElement('button');
            btn.className = `w-12 h-12 rounded-xl border-2 border-outline flex items-center justify-center font-label-md text-label-md transition-all active:scale-90 ${isOccupied ? 'seat-occupied' : 'hover:border-primary cursor-pointer'}`;
            btn.innerHTML = isOccupied ? '<span class="material-symbols-outlined text-[16px]">close</span>' : seatId;
            btn.id = `seat-${seatId}`;
            
            if (!isOccupied) {
                btn.addEventListener('click', () => selectSeat(seatId));
            } else {
                btn.disabled = true;
            }
            
            return btn;
        }

        function selectSeat(id) {
            if (currentSelected === id) {
                // Deselect
                const btn = document.getElementById(`seat-${id}`);
                btn.classList.remove('seat-selected');
                currentSelected = null;
                seatLabel.innerText = 'Belum memilih';
                confirmBtn.disabled = true;
                confirmBtn.classList.remove('bg-primary', 'text-on-primary');
                confirmBtn.classList.add('bg-outline-variant', 'text-on-surface-variant');
            } else {
                // Select new
                if (currentSelected) {
                    document.getElementById(`seat-${currentSelected}`).classList.remove('seat-selected');
                }
                currentSelected = id;
                document.getElementById(`seat-${id}`).classList.add('seat-selected');
                seatLabel.innerText = `Kursi ${id}`;
                confirmBtn.disabled = false;
                confirmBtn.classList.remove('bg-outline-variant', 'text-on-surface-variant', 'cursor-not-allowed');
                confirmBtn.classList.add('bg-primary', 'text-on-primary');
            }
        }

        // Initialize Grid 1-10
        for (let i = 1; i <= 10; i++) {
            leftGrid.appendChild(createSeat(i, 'A'));
            leftGrid.appendChild(createSeat(i, 'B'));
            rightGrid.appendChild(createSeat(i, 'C'));
            rightGrid.appendChild(createSeat(i, 'D'));
        }

        // Micro-interaction for the bottom sheet on click
        confirmBtn.addEventListener('click', () => {
            if (!confirmBtn.disabled) {
                confirmBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
                setTimeout(() => {
                    alert(`Pemesanan kursi ${currentSelected} berhasil!`);
                    confirmBtn.innerHTML = 'Berhasil';
                }, 800);
            }
        });
    </script>
