        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-background text-on-surface min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<header class="sticky top-0 w-full z-50 bg-surface border-b border-outline-variant h-16 flex items-center justify-between px-margin-mobile">
<div class="flex items-center gap-4">
<button class="text-primary p-2 rounded-full active:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary">Manajemen Profil</h1>
</div>
<button class="text-primary p-2 rounded-full active:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">settings</span>
</button>
</header>
<main class="flex-1 pb-32">
<!-- Profile Header Card -->
<div class="p-margin-mobile">
<div class="serene-bg rounded-xl p-6 shadow-md text-on-primary">
<div class="flex items-center gap-4 mb-6">
<div class="w-20 h-20 rounded-full bg-primary-fixed flex items-center justify-center text-primary font-bold text-headline-lg border-2 border-primary-fixed-dim/30">
                        AL
                    </div>
<div class="flex flex-col gap-1">
<h2 class="font-headline-lg text-headline-lg-mobile text-white">ALMA</h2>
<div class="inline-flex items-center gap-1.5 bg-secondary-container/20 px-3 py-1 rounded-full border border-secondary-container/30 w-fit">
<span class="material-symbols-outlined text-[16px] text-white" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="font-label-sm text-label-sm text-white">Premium Member</span>
</div>
</div>
</div>
<div class="grid grid-cols-2 gap-3">
<button class="flex items-center justify-center gap-2 bg-white/10 hover:bg-white/20 active:scale-95 transition-all py-3 rounded-lg border border-white/20">
<span class="material-symbols-outlined text-lg">person_edit</span>
<span class="font-label-md text-label-md">Lihat Profil</span>
</button>
<button class="flex items-center justify-center gap-2 bg-white/10 hover:bg-white/20 active:scale-95 transition-all py-3 rounded-lg border border-white/20">
<span class="material-symbols-outlined text-lg">qr_code_2</span>
<span class="font-label-md text-label-md">QR Code</span>
</button>
</div>
</div>
</div>
<!-- Menu List Section -->
<section class="px-margin-mobile space-y-3">
<!-- Ganti Kata Sandi -->
<button class="w-full flex items-center gap-4 p-4 bg-surface-container-lowest rounded-lg border border-outline-variant/30 active:bg-surface-container-low transition-all text-left">
<div class="w-10 h-10 rounded-full bg-primary-fixed-dim/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary">lock_reset</span>
</div>
<span class="flex-1 font-body-md text-body-md font-medium text-on-surface">Ganti Kata Sandi</span>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
<!-- Riwayat Transaksi -->
<button class="w-full flex items-center gap-4 p-4 bg-surface-container-lowest rounded-lg border border-outline-variant/30 active:bg-surface-container-low transition-all text-left">
<div class="w-10 h-10 rounded-full bg-primary-fixed-dim/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary">receipt_long</span>
</div>
<span class="flex-1 font-body-md text-body-md font-medium text-on-surface">Riwayat Transaksi</span>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
<!-- Member Benefit -->
<button class="w-full flex items-center gap-4 p-4 bg-surface-container-lowest rounded-lg border border-outline-variant/30 active:bg-surface-container-low transition-all text-left">
<div class="w-10 h-10 rounded-full bg-primary-fixed-dim/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary">workspace_premium</span>
</div>
<span class="flex-1 font-body-md text-body-md font-medium text-on-surface">Member Benefit</span>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
<!-- Daftar Penumpang -->
<button class="w-full flex items-center gap-4 p-4 bg-surface-container-lowest rounded-lg border border-outline-variant/30 active:bg-surface-container-low transition-all text-left">
<div class="w-10 h-10 rounded-full bg-primary-fixed-dim/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary">groups</span>
</div>
<span class="flex-1 font-body-md text-body-md font-medium text-on-surface">Daftar Penumpang</span>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>

<button class="w-full flex items-center gap-4 p-4 bg-surface-container-lowest rounded-lg border border-outline-variant/30 active:bg-surface-container-low transition-all text-left">
<div class="w-10 h-10 rounded-full bg-primary-fixed-dim/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary">payments</span>
</div>
<span class="flex-1 font-body-md text-body-md font-medium text-on-surface">Metode Pembayaran Saya</span>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>

<button class="w-full flex items-center gap-4 p-4 bg-surface-container-lowest rounded-lg border border-outline-variant/30 active:bg-surface-container-low transition-all text-left">

<span class="material-symbols-outlined text-primary">face_retouching_natural</span>
</div>

<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>

<div class="pt-6">
<button class="w-full flex items-center justify-center gap-2 py-4 text-error font-label-md bg-error-container/10 rounded-lg active:bg-error-container/20 transition-colors">
<span class="material-symbols-outlined">logout</span>

</div>

<span class="material-symbols-outlined">home</span>
<span class="font-label-sm text-label-sm mt-1">Beranda</span>
</button>

</button>

<div class="absolute -top-1 w-12 h-1 serene-bg rounded-full"></div>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-sm text-label-sm mt-1 font-bold">Profil</span>
</button>
